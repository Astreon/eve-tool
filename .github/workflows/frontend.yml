name: Frontend CI

on:
    pull_request:
        branches:
            - main
        paths:
            - 'frontend/**'
            - 'frontend.yml'
    push:
        branches: [main, develop]
        paths:
            - 'frontend/**'
            - 'frontend.yml'

jobs:
    frontend-checks:
        name: Checks
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Set build metadata
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VITE_APP_VERSION=$VERSION" >> $GITHUB_ENV
                  echo "VITE_APP_BUILD=${{ github.run_number }}" >> $GITHUB_ENV

            - name: Install dependencies
              run: npm ci

            - name: Generate TanStack Router types
              run: npm run routes:gen

            - name: Type check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Prettier check
              run: npm run prettier

            - name: Build
              run: npm run build

            - name: Create Nitro loader
              if: >
                  (github.event_name == 'pull_request' && github.base_ref == 'main') ||
                  (github.event_name == 'push' && github.ref == 'refs/heads/main')
              run: |
                  cat << 'EOF' > loader.cjs
                  /* eslint-disable no-global-assign, no-undef */

                  const OriginalURL = URL

                  function hasScheme(str) {
                    return /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(str)
                  }

                  function SafeURL(input, base) {
                    if (!(this instanceof SafeURL)) {
                      return new SafeURL(input, base)
                    }

                    if (typeof input === 'string' && !hasScheme(input)) {
                      return new OriginalURL('http://localhost' + input, base)
                    }

                    return new OriginalURL(input, base)
                  }

                  SafeURL.prototype = OriginalURL.prototype
                  Object.setPrototypeOf(SafeURL, OriginalURL)

                  global.URL = SafeURL

                  ;(async () => {
                    try {
                      await import('./.output/server/index.mjs')
                    } catch (err) {
                      console.error('[loader] Failed to start server:', err)
                      process.exit(1)
                    }
                  })()
                  EOF

            - name: Upload frontend artifact
              if: >
                  (github.event_name == 'pull_request' && github.base_ref == 'main') ||
                  (github.event_name == 'push' && github.ref == 'refs/heads/main')
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-app
                  include-hidden-files: true
                  path: |
                      frontend/.output
                      frontend/loader.cjs
                      frontend/package.json
                      frontend/package-lock.json
