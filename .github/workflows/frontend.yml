name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - "package.json"
      - "package-lock.json"
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - "package.json"
      - "package-lock.json"
      - '.github/workflows/frontend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check
        working-directory: .

      - name: Generate TanStack Router types
        run: npm run routes:gen

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  promote:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Find latest production deployment
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
        run: |
          DEPLOYMENT_URL=$(vercel list "$VERCEL_PROJECT_NAME" \
            --prod \
            --limit=1 \
            --json \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" \
            | jq -r '.[0].url')

          echo "deployment_url=$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Promote deployment to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          vercel promote "${{ steps.vercel.outputs.deployment_url }}" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" \
            --timeout=0