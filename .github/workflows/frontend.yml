name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - "package.json"
      - "package-lock.json"
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - "package.json"
      - "package-lock.json"
      - '.github/workflows/frontend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set build metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VITE_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VITE_APP_BUILD=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci
        
      - name: Format check
        run: npm run format:check
        working-directory: .

      - name: Generate TanStack Router types
        run: npm run routes:gen

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Vercel deploy
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"