name: Frontend CI

on:
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - "package.json"
      - "package-lock.json"
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - "package.json"
      - "package-lock.json"
      - '.github/workflows/frontend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check
        working-directory: .

      - name: Generate TanStack Router types
        run: npm run routes:gen

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build